# OtkazPro release: on tag vX.Y.Z
# - checks that the tag matches the plugin version and the readme Stable tag,
# - lints PHP, builds CSS + translations, packs otkazpro.zip (only files allowed by .distignore),
# - publishes a GitHub *pre-release* with the zip (pre-release so that old WPOtkaz installs,
#   which look at the "latest" release, are not offered OtkazPro),
# - deploys to WordPress.org SVN when the repository secrets SVN_USERNAME / SVN_PASSWORD exist.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check versions match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' otkazpro.php | awk '{print $3}')
          CONST=$(grep -m1 "PY_OTKAZ_VERSION'" otkazpro.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          STABLE=$(grep -m1 -i '^Stable tag:' readme.txt | awk '{print $3}')
          echo "tag=$TAG header=$HEADER const=$CONST stable=$STABLE"
          test "$TAG" = "$HEADER" && test "$TAG" = "$CONST" && test "$TAG" = "$STABLE"

      - name: Lint PHP
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Build (minify CSS, translations)
        run: php bin/build.php

      - name: Package
        run: |
          mkdir -p dist/otkazpro
          rsync -a --exclude-from=.distignore ./ dist/otkazpro/
          cd dist && zip -rq otkazpro.zip otkazpro

      - name: GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/otkazpro.zip
          prerelease: true
          generate_release_notes: true

      - name: Deploy to WordPress.org
        if: ${{ env.SVN_USERNAME != '' }}
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SLUG: otkazpro
          BUILD_DIR: dist/otkazpro
